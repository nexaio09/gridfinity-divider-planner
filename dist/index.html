<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Gridfinity 分隔板槽数与长度可视化计算工具">
  <title>Gridfinity 分隔板规划器</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111827'/%3E%3Cpath d='M14 18h36v28H14z' fill='none' stroke='%23f8fafc' stroke-width='4'/%3E%3Cpath d='M32 18v28M14 32h18' stroke='%2338bdf8' stroke-width='4'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #111827;
      --muted: #64748b;
      --line: #dbe2ea;
      --panel: #ffffff;
      --canvas: #f8fafc;
      --blue: #1687d9;
      --orange: #ec7c2c;
      --green: #0f9f76;
      --red: #dc4c5a;
      --shadow: 0 18px 50px rgba(15, 23, 42, .09);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% -10%, rgba(56,189,248,.13), transparent 34rem),
        linear-gradient(180deg, #f7fafc 0, #eef2f6 100%);
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .app { max-width: 1480px; margin: 0 auto; padding: 28px clamp(16px, 3vw, 42px) 36px; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-mark {
      width: 46px; height: 46px; border-radius: 13px; flex: 0 0 auto;
      display: grid; place-items: center; color: white; background: var(--ink);
      box-shadow: 0 10px 25px rgba(15,23,42,.18);
    }
    .brand-mark svg { width: 27px; }
    h1 { margin: 0; font-size: clamp(1.35rem, 2.2vw, 1.9rem); letter-spacing: -.035em; }
    .subtitle { margin: 5px 0 0; color: var(--muted); font-size: .92rem; }
    .formula-pill {
      flex: 0 0 auto; margin-top: 4px; padding: 9px 13px; border: 1px solid #cfd8e3;
      border-radius: 999px; color: #334155; background: rgba(255,255,255,.72);
      font: 600 .82rem ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .control-strip {
      display: grid; grid-template-columns: auto auto 1fr auto; align-items: end; gap: 14px;
      padding: 18px; margin-bottom: 14px; background: rgba(255,255,255,.88);
      border: 1px solid rgba(203,213,225,.82); border-radius: 18px; box-shadow: var(--shadow);
    }
    .field label { display: block; margin: 0 0 7px; font-size: .78rem; font-weight: 700; color: #475569; }
    .number-box { display: flex; align-items: center; gap: 8px; }
    .number-box input {
      width: 78px; height: 42px; padding: 0 10px; border: 1px solid #cbd5e1;
      border-radius: 10px; background: white; font-weight: 750; text-align: center; outline: none;
    }
    .number-box input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(22,135,217,.14); }
    .unit { color: var(--muted); font-size: .85rem; }
    .metrics { display: flex; gap: 10px 10px; align-items: stretch; min-width: 0; }
    .metric { min-width: 150px; padding: 8px 12px; border-left: 1px solid var(--line); }
    .metric-label { display: block; color: var(--muted); font-size: .72rem; }
    .metric-value { display: block; margin-top: 3px; font-size: .98rem; font-weight: 780; white-space: nowrap; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .btn {
      min-height: 40px; padding: 0 14px; border: 1px solid #cbd5e1; border-radius: 10px;
      background: white; font-size: .86rem; font-weight: 700; cursor: pointer;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }
    .btn:hover { border-color: #94a3b8; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn.primary { color: white; border-color: var(--ink); background: var(--ink); }
    .btn.danger { color: var(--red); }
    .main-grid { display: grid; grid-template-columns: minmax(0, 1fr) 335px; gap: 14px; align-items: stretch; }
    .card { border: 1px solid rgba(203,213,225,.88); border-radius: 18px; background: var(--panel); box-shadow: var(--shadow); }
    .workspace { overflow: hidden; min-height: 660px; display: flex; flex-direction: column; }
    .toolbar {
      min-height: 62px; display: flex; align-items: center; justify-content: space-between;
      gap: 14px; padding: 12px 15px; border-bottom: 1px solid var(--line); background: #fff;
    }
    .tool-group { display: flex; gap: 7px; flex-wrap: wrap; }
    .tool {
      min-height: 38px; padding: 0 13px; border: 1px solid #d5dde7; border-radius: 10px;
      background: #f8fafc; font-size: .84rem; font-weight: 720; cursor: pointer;
    }
    .tool[aria-pressed="true"] { color: #075985; border-color: #7dd3fc; background: #e0f2fe; box-shadow: inset 0 0 0 1px #bae6fd; }
    .hint { color: var(--muted); font-size: .8rem; text-align: right; }
    .slot-spec { color: #334155; font-weight: 720; white-space: nowrap; }
    .canvas-wrap {
      position: relative; flex: 1; min-height: 590px; display: grid; place-items: center;
      padding: 18px; overflow: hidden; background:
        linear-gradient(90deg, rgba(148,163,184,.08) 1px, transparent 1px),
        linear-gradient(rgba(148,163,184,.08) 1px, transparent 1px), #f8fafc;
      background-size: 24px 24px;
    }
    #planner { width: 100%; height: 100%; min-height: 545px; touch-action: none; user-select: none; }
    .panel { min-height: 660px; display: flex; flex-direction: column; overflow: hidden; }
    .panel-head { padding: 17px 18px 14px; border-bottom: 1px solid var(--line); }
    .panel-head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .panel h2 { margin: 0; font-size: 1rem; letter-spacing: -.015em; }
    .count-badge { padding: 4px 8px; border-radius: 999px; color: #075985; background: #e0f2fe; font-size: .74rem; font-weight: 800; }
    .panel-note { margin: 8px 0 0; color: var(--muted); font-size: .78rem; line-height: 1.5; }
    .divider-list { flex: 1; padding: 12px; overflow: auto; }
    .empty { height: 100%; min-height: 250px; display: grid; place-items: center; text-align: center; color: var(--muted); }
    .empty svg { width: 52px; margin-bottom: 10px; color: #94a3b8; }
    .empty p { max-width: 220px; margin: 0; font-size: .86rem; line-height: 1.6; }
    .divider-item {
      padding: 13px; margin-bottom: 9px; border: 1px solid #dbe2ea; border-radius: 13px;
      background: #fbfdff; cursor: pointer; transition: border-color .15s, box-shadow .15s;
    }
    .divider-item.selected { border-color: #7dd3fc; box-shadow: 0 0 0 3px rgba(56,189,248,.12); background: #f7fcff; }
    .item-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .item-name { display: flex; align-items: center; gap: 8px; font-weight: 820; }
    .swatch { width: 9px; height: 9px; border-radius: 999px; }
    .delete-btn { width: 30px; height: 30px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: #94a3b8; cursor: pointer; }
    .delete-btn:hover { color: var(--red); background: #fff1f2; }
    .item-result { display: flex; align-items: baseline; gap: 7px; margin: 10px 0 11px; }
    .slot-result { font-size: 1.28rem; font-weight: 860; letter-spacing: -.04em; }
    .mm-result { color: var(--muted); font-size: .84rem; font-weight: 700; }
    .coord-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 7px; align-items: end; }
    .coord label { display: block; margin-bottom: 4px; color: var(--muted); font-size: .68rem; font-weight: 700; }
    .coord input { width: 100%; height: 34px; padding: 0 7px; border: 1px solid #d6dee8; border-radius: 8px; background: white; text-align: center; font-weight: 700; outline: none; }
    .coord input:focus { border-color: var(--blue); }
    .arrow { padding-bottom: 7px; color: #94a3b8; }
    .summary { padding: 13px; border-top: 1px solid var(--line); background: #f8fafc; }
    .summary .btn { width: 100%; }
    .formula-card {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; margin-top: 14px;
      overflow: hidden; border: 1px solid rgba(203,213,225,.85); border-radius: 16px; background: var(--line);
    }
    .formula-block { padding: 14px 17px; background: rgba(255,255,255,.88); }
    .formula-block strong { display: block; margin-bottom: 5px; font-size: .78rem; color: #475569; }
    .formula-block code { color: #0f172a; font: 700 .85rem ui-monospace, SFMono-Regular, Menlo, monospace; }
    .toast {
      position: fixed; left: 50%; bottom: 24px; z-index: 20; transform: translate(-50%, 18px);
      padding: 10px 14px; border-radius: 10px; color: white; background: #111827;
      box-shadow: 0 12px 35px rgba(15,23,42,.26); font-size: .84rem; font-weight: 700;
      opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 1040px) {
      .control-strip { grid-template-columns: auto auto 1fr; }
      .actions { grid-column: 1 / -1; justify-content: flex-start; }
      .main-grid { grid-template-columns: 1fr; }
      .workspace, .panel { min-height: auto; }
      .panel { max-height: none; }
      .divider-list { max-height: 430px; }
    }
    @media (max-width: 720px) {
      .app { padding: 18px 10px 28px; }
      .topbar { align-items: center; }
      .formula-pill { display: none; }
      .control-strip { grid-template-columns: 1fr 1fr; padding: 14px; }
      .metrics { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; }
      .metric { min-width: 0; border-left: 0; border-top: 1px solid var(--line); padding: 10px 2px 2px; }
      .actions { grid-column: 1 / -1; }
      .actions .btn { flex: 1; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .hint { text-align: left; }
      .canvas-wrap { min-height: 465px; padding: 7px; }
      #planner { min-height: 450px; }
      .formula-card { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><rect x="4" y="5" width="24" height="22" rx="2" stroke="currentColor" stroke-width="2.5"/><path d="M16 5v22M4 16h12" stroke="#38bdf8" stroke-width="2.5"/></svg>
        </div>
        <div>
          <h1>Gridfinity 分隔板规划器</h1>
          <p class="subtitle">在槽位图上画分隔线，自动得到所需槽数与板长。</p>
        </div>
      </div>
      <div class="formula-pill">板长 = 槽数 × 6 + 5 mm</div>
    </header>

    <section class="control-strip" aria-label="盒体参数">
      <div class="field">
        <label for="xCells">X 轴格数</label>
        <div class="number-box"><input id="xCells" type="number" min="1" max="20" step="1" value="6"><span class="unit">格</span></div>
      </div>
      <div class="field">
        <label for="yCells">Y 轴格数</label>
        <div class="number-box"><input id="yCells" type="number" min="1" max="20" step="1" value="6"><span class="unit">格</span></div>
      </div>
      <div class="metrics" aria-live="polite">
        <div class="metric"><span class="metric-label">盒体外形</span><span class="metric-value" id="outerSize">251.5 × 251.5 mm</span></div>
        <div class="metric"><span class="metric-label">完整槽位</span><span class="metric-value" id="slotSize">X 40槽 · Y 40槽</span></div>
      </div>
      <div class="actions">
        <button class="btn danger" id="clearAll" type="button">清空分隔板</button>
      </div>
    </section>

    <div class="main-grid">
      <section class="card workspace" aria-label="分隔板绘图区">
        <div class="canvas-wrap">
          <svg id="planner" role="img" aria-label="Gridfinity 盒体槽位规划图"></svg>
        </div>
      </section>

      <aside class="card panel" aria-label="分隔板清单">
        <div class="panel-head">
          <div class="panel-head-row"><h2>分隔板清单</h2><span class="count-badge" id="dividerCount">0 块</span></div>
          <p class="panel-note">边框拖动新增 · 线身延长/分支 · 标注拖动移动 · 右键删除</p>
        </div>
        <div class="divider-list" id="dividerList"></div>
        <div class="summary"><button class="btn primary" id="copyList" type="button">复制定制清单</button></div>
      </aside>
    </div>

  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      const SVG_NS = 'http://www.w3.org/2000/svg';
      const colors = ['#1687d9', '#ec7c2c', '#0f9f76', '#8b5cf6', '#dc4c5a', '#0891b2'];

      // 实物参数（mm）：内腔 = 格数×42−9，外形 = 格数×42−0.5，槽距 6，槽宽 3，槽深 1.1，壁厚 4.25
      const CELL = 42, CAVITY_LOSS = 9, OUTER_LOSS = .5;
      const PITCH = 6, GROOVE_W = 3, GROOVE_D = 1.1, WALL_T = 4.25, BOARD_T = 3;
      const END_GAP = PITCH - GROOVE_W / 2;   // 内壁到首槽中心 = 4.5

      const slotsForCells = n => 7 * n - 2;
      const outerForCells = n => CELL * n - OUTER_LOSS;
      const cavityForCells = n => CELL * n - CAVITY_LOSS;
      const lengthForSlots = n => PITCH * n + 5;
      const grooveCenter = k => END_GAP + PITCH * (k - 1);
      const round1 = v => Math.round(v * 10) / 10;

      const state = { xCells: 6, yCells: 6, dividers: [], selected: null, draft: null, drawOrigin: null, moving: null, bodyGesture: null, extending: null };
      const el = id => document.getElementById(id);
      const svg = el('planner');
      const layout = { vbW: 760, vbH: 610, left: 82, top: 46, right: 34, bottom: 64 };

      const maxX = () => slotsForCells(state.xCells);
      const maxY = () => slotsForCells(state.yCells);

      function axisOf(cells) {
        const N = slotsForCells(cells), L = cavityForCells(cells);
        const cuts = [0];
        for (let k = 1; k <= N; k++) cuts.push(grooveCenter(k));
        cuts.push(L);
        return { N, L, cuts };
      }
      const axX = () => axisOf(state.xCells);
      const axY = () => axisOf(state.yCells);

      function geometry() {
        const ax = axX(), ay = axY();
        const availW = layout.vbW - layout.left - layout.right;
        const availH = layout.vbH - layout.top - layout.bottom;
        const outW = ax.L + WALL_T * 2, outH = ay.L + WALL_T * 2;
        const scale = Math.min(availW / outW, availH / outH);
        const ox = layout.left + (availW - outW * scale) / 2;
        const oy = layout.top + (availH - outH * scale) / 2;
        return {
          ax, ay, scale, ox, oy,
          x: ox + WALL_T * scale, y: oy + WALL_T * scale,
          w: ax.L * scale, h: ay.L * scale,
          outW: outW * scale, outH: outH * scale
        };
      }

      function node(name, attrs = {}, text = '') {
        const n = document.createElementNS(SVG_NS, name);
        for (const [key, value] of Object.entries(attrs)) n.setAttribute(key, value);
        if (text) n.textContent = text;
        return n;
      }

      function svgPoint(evt) {
        const p = svg.createSVGPoint(); p.x = evt.clientX; p.y = evt.clientY;
        return p.matrixTransform(svg.getScreenCTM().inverse());
      }

      function mmPoint(evt) {
        const g = geometry(), p = svgPoint(evt);
        return {
          x: Math.min(g.ax.L, Math.max(0, (p.x - g.x) / g.scale)),
          y: Math.min(g.ay.L, Math.max(0, (p.y - g.y) / g.scale))
        };
      }

      const grooveAtMm = (ax, mm) => Math.min(ax.N, Math.max(1, Math.round((mm - END_GAP) / PITCH) + 1));

      // Support indices distinguish the last groove N from the far wall N+1.
      function supportIndex(ax, mm) {
        if (Math.abs(mm) <= .8) return 0;
        if (Math.abs(mm - ax.L) <= .8) return ax.N + 1;
        return grooveAtMm(ax, mm);
      }

      // 分隔板的端点只能落在“支撑”上：两侧墙，或与它垂直的另一块板所在槽位
      function supportsOf(orientation, skipId, position) {
        const ax = orientation === 'H' ? axX() : axY();
        const list = [{ idx: 0, mm: 0 }, { idx: ax.N + 1, mm: ax.L }];
        for (const d of state.dividers) {
          if (d.id === skipId) continue;
          const lo = Math.min(orientation === 'H' ? d.y1 : d.x1, orientation === 'H' ? d.y2 : d.x2);
          const hi = Math.max(orientation === 'H' ? d.y1 : d.x1, orientation === 'H' ? d.y2 : d.x2);
          if (position < lo - 1e-6 || position > hi + 1e-6) continue;
          if (orientation === 'H' && d.orientation === 'V') list.push({ idx: grooveAtMm(ax, d.x1), mm: d.x1 });
          if (orientation === 'V' && d.orientation === 'H') list.push({ idx: grooveAtMm(ax, d.y1), mm: d.y1 });
        }
        return list;
      }

      function snapSupport(orientation, mm, skipId, position) {
        const list = supportsOf(orientation, skipId, position);
        let best = list[0], dist = Infinity;
        for (const s of list) {
          const dd = Math.abs(s.mm - mm);
          if (dd < dist) { dist = dd; best = s; }
        }
        return best;
      }

      // 槽数 = 这段跨度里剩下的空槽数（末端插着分隔板时，它自己占掉一个槽，要减 1）；板长 = 槽数 × 6 + 5
      // 例（2 格宽，V1 插第 4 槽、V2 插第 8 槽）：墙 → 第 4 槽 = 3 槽 23mm；
      //   第 4 → 第 8 槽 = 3 槽 23mm；第 8 槽 → 墙 = 4 槽 29mm；3+1+3+1+4 = 12
      function slotsOf(d) {
        const ax = d.orientation === 'H' ? axX() : axY();
        const a = d.orientation === 'H' ? d.x1 : d.y1;
        const b = d.orientation === 'H' ? d.x2 : d.y2;
        const lo = Math.min(a, b), hi = Math.max(a, b);
        const span = Math.abs(supportIndex(ax, hi) - supportIndex(ax, lo));
        return Math.max(0, span - 1);
      }

      function posSlotOf(d) {
        return d.orientation === 'H' ? grooveAtMm(axY(), d.y1) : grooveAtMm(axX(), d.x1);
      }

      function makeDraft(orientation, posIdx, a, b) {
        if (orientation === 'H') {
          const y = grooveCenter(posIdx);
          return { orientation, x1: a.mm, y1: y, x2: b.mm, y2: y };
        }
        const x = grooveCenter(posIdx);
        return { orientation, x1: x, y1: a.mm, x2: x, y2: b.mm };
      }

      function labelFor(divider) {
        const same = state.dividers.filter(d => d.orientation === divider.orientation);
        return divider.orientation + (same.indexOf(divider) + 1);
      }

      const rid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));

      // 把内腔切成 (N+1)×(M+1) 个连通区块，被分隔板挡住的边不可通过，flood fill 出隔间
      function compartments(g) {
        const ax = g.ax, ay = g.ay;
        const NX = ax.N + 1, NY = ay.N + 1;
        const blockedV = new Set(), blockedH = new Set();
        for (const d of state.dividers) {
          if (d.orientation === 'V') {
            const gi = grooveAtMm(ax, d.x1);
            const a = Math.min(d.y1, d.y2), b = Math.max(d.y1, d.y2);
            for (let j = 0; j < NY; j++) {
              const mid = (ay.cuts[j] + ay.cuts[j + 1]) / 2;
              if (mid > a + 1e-6 && mid < b - 1e-6) blockedV.add(gi + ',' + j);
            }
          } else {
            const gi = grooveAtMm(ay, d.y1);
            const a = Math.min(d.x1, d.x2), b = Math.max(d.x1, d.x2);
            for (let i = 0; i < NX; i++) {
              const mid = (ax.cuts[i] + ax.cuts[i + 1]) / 2;
              if (mid > a + 1e-6 && mid < b - 1e-6) blockedH.add(i + ',' + gi);
            }
          }
        }
        const seen = new Int32Array(NX * NY).fill(-1);
        const comps = [];
        for (let j = 0; j < NY; j++) {
          for (let i = 0; i < NX; i++) {
            const id = j * NX + i;
            if (seen[id] >= 0) continue;
            const c = { i0: i, i1: i, j0: j, j1: j, area: 0, sx: 0, sy: 0 };
            const stack = [[i, j]];
            seen[id] = comps.length;
            while (stack.length) {
              const [ci, cj] = stack.pop();
              c.area++;
              c.sx += (ax.cuts[ci] + ax.cuts[ci + 1]) / 2;
              c.sy += (ay.cuts[cj] + ay.cuts[cj + 1]) / 2;
              if (ci < c.i0) c.i0 = ci;
              if (ci > c.i1) c.i1 = ci;
              if (cj < c.j0) c.j0 = cj;
              if (cj > c.j1) c.j1 = cj;
              const moves = [
                [ci - 1, cj, !blockedV.has(ci + ',' + cj)],
                [ci + 1, cj, !blockedV.has((ci + 1) + ',' + cj)],
                [ci, cj - 1, !blockedH.has(ci + ',' + cj)],
                [ci, cj + 1, !blockedH.has(ci + ',' + (cj + 1))]
              ];
              for (const [ni, nj, open] of moves) {
                if (!open || ni < 0 || nj < 0 || ni >= NX || nj >= NY) continue;
                const nid = nj * NX + ni;
                if (seen[nid] >= 0) continue;
                seen[nid] = comps.length;
                stack.push([ni, nj]);
              }
            }
            comps.push(c);
          }
        }
        for (const c of comps) {
          c.wSlots = c.i1 - c.i0;
          c.hSlots = c.j1 - c.j0;
          c.x0 = ax.cuts[c.i0]; c.x1 = ax.cuts[c.i1 + 1];
          c.y0 = ay.cuts[c.j0]; c.y1 = ay.cuts[c.j1 + 1];
          c.wMm = Math.max(0, c.x1 - c.x0 - (c.i0 > 0 ? BOARD_T / 2 : 0) - (c.i1 < NX - 1 ? BOARD_T / 2 : 0));
          c.hMm = Math.max(0, c.y1 - c.y0 - (c.j0 > 0 ? BOARD_T / 2 : 0) - (c.j1 < NY - 1 ? BOARD_T / 2 : 0));
          c.cx = c.sx / c.area;
          c.cy = c.sy / c.area;
        }
        comps.sort((a, b) => (a.j0 - b.j0) || (a.i0 - b.i0));
        return comps;
      }

      function draw(g = geometry()) {
        svg.innerHTML = '';
        svg.setAttribute('viewBox', `0 0 ${layout.vbW} ${layout.vbH}`);
        const ax = g.ax, ay = g.ay;
        const X = v => g.x + v * g.scale;
        const Y = v => g.y + v * g.scale;
        const top = g.y, bottom = g.y + g.h, leftX = g.x, rightX = g.x + g.w;
        const cx = g.x + g.w / 2, cy = g.y + g.h / 2;

        const defs = node('defs');
        const shadow = node('filter', { id: 'shadow', x: '-20%', y: '-20%', width: '140%', height: '140%' });
        shadow.append(node('feDropShadow', { dx: '0', dy: '5', stdDeviation: '7', 'flood-color': '#0f172a', 'flood-opacity': '.12' }));
        defs.append(shadow);
        svg.append(defs);

        svg.append(node('rect', { x: g.ox, y: g.oy, width: g.outW, height: g.outH, rx: 6, fill: '#94a3b8', stroke: '#334155', 'stroke-width': 1.5, filter: 'url(#shadow)' }));
        svg.append(node('rect', { x: leftX, y: top, width: g.w, height: g.h, fill: '#fbfdff' }));

        // 筋：每两槽之间一条，每 7 槽一条是格与格的分界
        const ribs = node('g', { 'pointer-events': 'none' });
        for (let k = 1; k < ax.N; k++) {
          const x = X(grooveCenter(k) + PITCH / 2);
          const major = (k - 6) % 7 === 0;
          ribs.append(node('line', { x1: x, y1: top, x2: x, y2: bottom, stroke: major ? '#cbd5e1' : '#e2e8f0', 'stroke-width': major ? 1.1 : .7, 'stroke-dasharray': major ? 'none' : '2 4' }));
        }
        for (let k = 1; k < ay.N; k++) {
          const y = Y(grooveCenter(k) + PITCH / 2);
          const major = (k - 6) % 7 === 0;
          ribs.append(node('line', { x1: leftX, y1: y, x2: rightX, y2: y, stroke: major ? '#cbd5e1' : '#e2e8f0', 'stroke-width': major ? 1.1 : .7, 'stroke-dasharray': major ? 'none' : '2 4' }));
        }
        svg.append(ribs);

        // 凹槽：画在壁厚里，从内腔边界向外凹 1.1mm
        const gw = GROOVE_W * g.scale;
        const depth = GROOVE_D * g.scale;
        const rad = .5 * g.scale;
        const grooves = node('g', { 'data-part': 'grooves', fill: '#fbfdff', 'pointer-events': 'none' });
        for (let k = 1; k <= ax.N; k++) {
          const c = X(grooveCenter(k));
          const x0 = c - gw / 2, x1 = c + gw / 2;
          const r = Math.min(rad, gw / 2, depth);
          grooves.append(node('path', { 'data-side': 'top', d: `M ${x0} ${top} V ${top - depth + r} Q ${x0} ${top - depth} ${x0 + r} ${top - depth} H ${x1 - r} Q ${x1} ${top - depth} ${x1} ${top - depth + r} V ${top} Z` }));
          grooves.append(node('path', { 'data-side': 'bottom', d: `M ${x0} ${bottom} V ${bottom + depth - r} Q ${x0} ${bottom + depth} ${x0 + r} ${bottom + depth} H ${x1 - r} Q ${x1} ${bottom + depth} ${x1} ${bottom + depth - r} V ${bottom} Z` }));
        }
        for (let k = 1; k <= ay.N; k++) {
          const c = Y(grooveCenter(k));
          const y0 = c - gw / 2, y1 = c + gw / 2;
          const r = Math.min(rad, gw / 2, depth);
          grooves.append(node('path', { 'data-side': 'left', d: `M ${leftX} ${y0} H ${leftX - depth + r} Q ${leftX - depth} ${y0} ${leftX - depth} ${y0 + r} V ${y1 - r} Q ${leftX - depth} ${y1} ${leftX - depth + r} ${y1} H ${leftX} Z` }));
          grooves.append(node('path', { 'data-side': 'right', d: `M ${rightX} ${y0} H ${rightX + depth - r} Q ${rightX + depth} ${y0} ${rightX + depth} ${y0 + r} V ${y1 - r} Q ${rightX + depth} ${y1} ${rightX + depth - r} ${y1} H ${rightX} Z` }));
        }
        svg.append(grooves);

        if (state.dividers.length) {
          const labels = node('g', { 'pointer-events': 'none' });
          for (const c of compartments(g)) {
            // A bounding rectangle is not a valid dimension for an L-shaped region.
            if (c.area !== (c.i1 - c.i0 + 1) * (c.j1 - c.j0 + 1)) continue;
            if ((c.x1 - c.x0) * g.scale < 75 || (c.y1 - c.y0) * g.scale < 40) continue;
            labels.append(node('text', { x: X((c.x0 + c.x1) / 2), y: Y((c.y0 + c.y1) / 2), fill: '#64748b', 'font-size': 11, 'text-anchor': 'middle' }, `${c.wSlots} × ${c.hSlots} 槽`));
            labels.append(node('text', { x: X((c.x0 + c.x1) / 2), y: Y((c.y0 + c.y1) / 2) + 15, fill: '#94a3b8', 'font-size': 9, 'text-anchor': 'middle' }, `${round1(c.wMm)} × ${round1(c.hMm)} mm`));
          }
          svg.append(labels);
        }

        // 刻度：槽位序号（1..N），标 1、5 的倍数、N
        for (let k = 1; k <= ax.N; k++) {
          if (k !== 1 && k !== ax.N && k % 5 !== 0) continue;
          svg.append(node('text', { x: X(grooveCenter(k)), y: g.oy + g.outH + 18, fill: '#64748b', 'font-size': 11, 'text-anchor': 'middle' }, String(k)));
        }
        for (let k = 1; k <= ay.N; k++) {
          if (k !== 1 && k !== ay.N && k % 5 !== 0) continue;
          svg.append(node('text', { x: g.ox - 10, y: Y(grooveCenter(k)) + 4, fill: '#64748b', 'font-size': 11, 'text-anchor': 'end' }, String(k)));
        }
        svg.append(node('text', { x: cx, y: g.oy + g.outH + 40, fill: '#475569', 'font-size': 12, 'font-weight': 700, 'text-anchor': 'middle' }, `X 轴 · ${ax.N} 槽`));
        svg.append(node('text', { x: g.ox - 40, y: cy, fill: '#475569', 'font-size': 12, 'font-weight': 700, 'text-anchor': 'middle', transform: `rotate(-90 ${g.ox - 40} ${cy})` }, `Y 轴 · ${ay.N} 槽`));

        const hit = node('rect', { x: g.ox, y: g.oy, width: g.outW, height: g.outH, rx: 6, fill: 'transparent', style: 'cursor:crosshair' });
        hit.addEventListener('pointerdown', beginDraw);
        svg.append(hit);

        state.dividers.forEach((d, index) => drawDivider(d, index, d.id === state.selected));
        if (state.draft) drawDivider(state.draft, -1, false, true);
      }

      function drawDivider(d, index, selected, draft = false) {
        const g = geometry();
        const X = v => g.x + v * g.scale;
        const Y = v => g.y + v * g.scale;
        const color = draft ? '#475569' : colors[index % colors.length];
        const a = { x: X(d.x1), y: Y(d.y1) }, b = { x: X(d.x2), y: Y(d.y2) };
        const slots = slotsOf(d);
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        const group = node('g', { style: draft ? 'pointer-events:none' : 'cursor:crosshair' });
        if (!draft) group.append(node('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: 'transparent', 'stroke-width': 24, 'stroke-linecap': 'round', 'pointer-events': 'stroke' }));
        group.append(node('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: '#fff', 'stroke-width': selected ? 10 : 8, 'stroke-linecap': 'round', opacity: .92 }));
        const visible = node('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: color, 'stroke-width': selected ? 5 : 4, 'stroke-linecap': 'round', 'stroke-dasharray': draft ? '7 6' : 'none', opacity: draft ? .78 : 1 });
        group.append(visible);
        const startHandle = node('circle', { cx: a.x, cy: a.y, r: selected ? 6 : 5, fill: '#fff', stroke: color, 'stroke-width': 2.5, style: `cursor:${d.orientation === 'H' ? 'ew-resize' : 'ns-resize'}` });
        const endHandle = node('circle', { cx: b.x, cy: b.y, r: selected ? 6 : 5, fill: '#fff', stroke: color, 'stroke-width': 2.5, style: `cursor:${d.orientation === 'H' ? 'ew-resize' : 'ns-resize'}` });
        group.append(startHandle);
        group.append(endHandle);
        const labelY = d.orientation === 'H' ? my - 10 : my;
        const labelX = d.orientation === 'H' ? mx : mx + 12;
        const rot = d.orientation === 'V' ? `rotate(-90 ${labelX} ${labelY})` : '';
        const content = draft ? `${slots}槽 · ${lengthForSlots(slots)}mm` : `${labelFor(d)}  ${slots}槽`;
        if (!draft) {
          group.addEventListener('pointerdown', evt => { evt.stopPropagation(); state.selected = d.id; beginBodyGesture(evt, d); });
          group.addEventListener('contextmenu', evt => { evt.preventDefault(); evt.stopPropagation(); deleteDividerWithToast(d.id); });
          startHandle.addEventListener('pointerdown', evt => { evt.stopPropagation(); state.selected = d.id; beginExtend(evt, d, 'start'); });
          endHandle.addEventListener('pointerdown', evt => { evt.stopPropagation(); state.selected = d.id; beginExtend(evt, d, 'end'); });
        }
        svg.append(group);

        const labelGroup = node('g', { style: draft ? 'pointer-events:none' : 'cursor:move' });
        labelGroup.append(node('rect', { x: labelX - 32, y: labelY - 13, width: 64, height: 22, rx: 7, fill: 'transparent' }));
        labelGroup.append(node('text', { x: labelX, y: labelY, fill: color, 'font-size': 12, 'font-weight': 800, 'text-anchor': 'middle', transform: rot, stroke: '#fff', 'stroke-width': 4, 'paint-order': 'stroke' }, content));
        if (!draft) {
          labelGroup.addEventListener('pointerdown', evt => { evt.stopPropagation(); state.selected = d.id; beginMove(evt, d); });
          labelGroup.addEventListener('contextmenu', evt => { evt.preventDefault(); evt.stopPropagation(); deleteDividerWithToast(d.id); });
        }
        svg.append(labelGroup);
      }

      function beginDraw(evt) {
        if (evt.button !== undefined && evt.button !== 0) return;
        evt.preventDefault();
        const p = mmPoint(evt), ax = axX(), ay = axY();
        const onBorder = p.x <= PITCH / 2 || Math.abs(p.x - ax.L) <= PITCH / 2 || p.y <= PITCH / 2 || Math.abs(p.y - ay.L) <= PITCH / 2;
        if (!onBorder) { showToast('起点必须在盒体边框上'); return; }
        const direction = Math.min(p.x, ax.L - p.x) < Math.min(p.y, ay.L - p.y) ? 'H' : 'V';
        const posIdx = grooveAtMm(direction === 'H' ? ay : ax, direction === 'H' ? p.y : p.x);
        const position = grooveCenter(posIdx);
        if (Math.abs((direction === 'H' ? p.y : p.x) - position) > GROOVE_W / 2 + .1) { showToast('请从边框凹槽内开始拖动'); return; }
        state.drawOrigin = { mm: p, screen: svgPoint(evt), direction, posIdx };
        const a = snapSupport(direction, direction === 'H' ? p.x : p.y, null, position);
        state.draft = makeDraft(direction, posIdx, a, a);
        svg.setPointerCapture?.(evt.pointerId);
        svg.addEventListener('pointermove', moveDraw);
        svg.addEventListener('pointerup', endDraw, { once: true });
        svg.addEventListener('pointercancel', endDraw, { once: true });
      }

      function moveDraw(evt) {
        if (!state.draft || !state.drawOrigin) return;
        const p = mmPoint(evt), raw = svgPoint(evt), start = state.drawOrigin.mm;
        const direction = state.drawOrigin.direction, posIdx = state.drawOrigin.posIdx, position = grooveCenter(posIdx);
        if (direction === 'H') {
          state.draft = makeDraft('H', posIdx, snapSupport('H', start.x, null, position), snapSupport('H', p.x, null, position));
        } else {
          state.draft = makeDraft('V', posIdx, snapSupport('V', start.y, null, position), snapSupport('V', p.y, null, position));
        }
        draw();
      }

      function endDraw() {
        svg.removeEventListener('pointermove', moveDraw);
        if (!state.draft) return;
        const draft = state.draft;
        const span = Math.abs(draft.orientation === 'H' ? draft.x2 - draft.x1 : draft.y2 - draft.y1);
        if (span > .01) {
          if (draft.orientation === 'H' && draft.x2 < draft.x1) [draft.x1, draft.x2] = [draft.x2, draft.x1];
          if (draft.orientation === 'V' && draft.y2 < draft.y1) [draft.y1, draft.y2] = [draft.y2, draft.y1];
          const divider = { ...draft, id: rid() };
          state.dividers.push(divider);
          state.selected = divider.id;
        }
        state.draft = null; state.drawOrigin = null; render();
      }

      function beginMove(evt, divider) {
        evt.preventDefault();
        state.moving = { id: divider.id };
        svg.setPointerCapture?.(evt.pointerId);
        svg.addEventListener('pointermove', moveDivider);
        svg.addEventListener('pointerup', endMove, { once: true });
        svg.addEventListener('pointercancel', endMove, { once: true });
      }

      function moveDivider(evt) {
        if (!state.moving) return;
        const divider = state.dividers.find(item => item.id === state.moving.id);
        if (!divider) return;
        const p = mmPoint(evt);
        const original = { ...divider };
        if (divider.orientation === 'H') divider.y1 = divider.y2 = grooveCenter(grooveAtMm(axY(), p.y));
        else divider.x1 = divider.x2 = grooveCenter(grooveAtMm(axX(), p.x));
        for (const child of state.dividers) {
          if (child.id === divider.id || child.orientation === divider.orientation) continue;
          const at = child.orientation === 'H' ? child.y1 : child.x1;
          const lo = divider.orientation === 'V' ? Math.min(original.y1, original.y2) : Math.min(original.x1, original.x2);
          const hi = divider.orientation === 'V' ? Math.max(original.y1, original.y2) : Math.max(original.x1, original.x2);
          if (at < lo - 1e-6 || at > hi + 1e-6) continue;
          const before = divider.orientation === 'V' ? original.x1 : original.y1;
          const after = divider.orientation === 'V' ? divider.x1 : divider.y1;
          for (const key of child.orientation === 'H' ? ['x1', 'x2'] : ['y1', 'y2']) {
            if (Math.abs(child[key] - before) < 1e-6) child[key] = after;
          }
        }
        draw();
      }

      function endMove() { svg.removeEventListener('pointermove', moveDivider); state.moving = null; render(); }

      function beginExtend(evt, divider, end) {
        evt.preventDefault();
        state.extending = { id: divider.id, end };
        svg.setPointerCapture?.(evt.pointerId);
        svg.addEventListener('pointermove', moveExtend);
        svg.addEventListener('pointerup', endExtend, { once: true });
        svg.addEventListener('pointercancel', endExtend, { once: true });
      }

      function moveExtend(evt) {
        if (!state.extending) return;
        const divider = state.dividers.find(item => item.id === state.extending.id);
        if (!divider) return;
        const p = mmPoint(evt);
        if (divider.orientation === 'H') {
          divider[state.extending.end === 'start' ? 'x1' : 'x2'] = snapSupport('H', p.x, divider.id, divider.y1).mm;
        } else {
          divider[state.extending.end === 'start' ? 'y1' : 'y2'] = snapSupport('V', p.y, divider.id, divider.x1).mm;
        }
        draw();
      }

      function endExtend() { svg.removeEventListener('pointermove', moveExtend); state.extending = null; render(); }

      function beginBodyGesture(evt, divider) {
        evt.preventDefault();
        state.bodyGesture = { id: divider.id, start: mmPoint(evt), screen: svgPoint(evt), action: null };
        svg.setPointerCapture?.(evt.pointerId);
        svg.addEventListener('pointermove', moveBodyGesture);
        svg.addEventListener('pointerup', endBodyGesture, { once: true });
        svg.addEventListener('pointercancel', endBodyGesture, { once: true });
      }

      function moveBodyGesture(evt) {
        if (!state.bodyGesture) return;
        const divider = state.dividers.find(item => item.id === state.bodyGesture.id);
        if (!divider) return;
        const raw = svgPoint(evt), p = mmPoint(evt);
        const dx = raw.x - state.bodyGesture.screen.x, dy = raw.y - state.bodyGesture.screen.y;
        if (!state.bodyGesture.action && Math.max(Math.abs(dx), Math.abs(dy)) > 5) {
          const parallel = divider.orientation === 'H' ? Math.abs(dx) : Math.abs(dy);
          const perpendicular = divider.orientation === 'H' ? Math.abs(dy) : Math.abs(dx);
          state.bodyGesture.action = parallel >= perpendicular ? 'extend' : 'branch';
          if (state.bodyGesture.action === 'branch') {
            const orientation = divider.orientation === 'H' ? 'V' : 'H';
            const anchor = divider.orientation === 'H'
              ? { idx: grooveAtMm(axY(), divider.y1), mm: divider.y1 }
              : { idx: grooveAtMm(axX(), divider.x1), mm: divider.x1 };
            const posIdx = orientation === 'V' ? grooveAtMm(axX(), state.bodyGesture.start.x) : grooveAtMm(axY(), state.bodyGesture.start.y);
            state.draft = makeDraft(orientation, posIdx, anchor, anchor);
          }
        }
        if (state.bodyGesture.action === 'extend') {
          if (divider.orientation === 'H') divider[dx < 0 ? 'x1' : 'x2'] = snapSupport('H', p.x, divider.id, divider.y1).mm;
          else divider[dy < 0 ? 'y1' : 'y2'] = snapSupport('V', p.y, divider.id, divider.x1).mm;
        } else if (state.bodyGesture.action === 'branch' && state.draft) {
          if (state.draft.orientation === 'H') state.draft.x2 = snapSupport('H', p.x, null, state.draft.y1).mm;
          else state.draft.y2 = snapSupport('V', p.y, null, state.draft.x1).mm;
        }
        if (state.bodyGesture.action) draw();
      }

      function endBodyGesture() {
        svg.removeEventListener('pointermove', moveBodyGesture);
        if (state.bodyGesture?.action === 'branch' && state.draft) {
          const draft = state.draft;
          const span = Math.abs(draft.orientation === 'H' ? draft.x2 - draft.x1 : draft.y2 - draft.y1);
          if (span > .01) {
            if (draft.orientation === 'H' && draft.x2 < draft.x1) [draft.x1, draft.x2] = [draft.x2, draft.x1];
            if (draft.orientation === 'V' && draft.y2 < draft.y1) [draft.y1, draft.y2] = [draft.y2, draft.y1];
            const divider = { ...draft, id: rid() };
            state.dividers.push(divider);
            state.selected = divider.id;
          }
        }
        state.draft = null; state.bodyGesture = null; render();
      }

      function updateDimensions() {
        state.xCells = Math.min(20, Math.max(1, Math.round(Number(el('xCells').value) || 1)));
        state.yCells = Math.min(20, Math.max(1, Math.round(Number(el('yCells').value) || 1)));
        el('xCells').value = state.xCells;
        el('yCells').value = state.yCells;
        state.dividers = [];
        state.selected = null;
        render();
        showToast('盒体尺寸已更新，布局已重置');
      }

      function deleteDivider(id) {
        state.dividers = state.dividers.filter(d => d.id !== id);
        if (state.selected === id) state.selected = state.dividers[0]?.id || null;
        render();
      }

      function deleteDividerWithToast(id) {
        const divider = state.dividers.find(d => d.id === id);
        const label = divider ? labelFor(divider) : '分隔板';
        deleteDivider(id);
        showToast(`${label} 已删除`);
      }

      function renderList() {
        const list = el('dividerList'); list.innerHTML = '';
        el('dividerCount').textContent = `${state.dividers.length} 块`;
        if (!state.dividers.length) {
          const empty = document.createElement('div'); empty.className = 'empty';
          empty.innerHTML = '<div><svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><rect x="9" y="10" width="46" height="44" rx="4" stroke="currentColor" stroke-width="3"/><path d="M32 10v44M9 32h23" stroke="currentColor" stroke-width="3" stroke-dasharray="4 4"/></svg><p>从盒体边框拖动即可新增分隔板。</p></div>';
          list.append(empty);
          return;
        }
        state.dividers.forEach((d, index) => {
          const slots = slotsOf(d);
          const posIndex = d.orientation === 'H' ? grooveAtMm(axY(), d.y1) : grooveAtMm(axX(), d.x1);
          const item = document.createElement('article');
          item.className = 'divider-item' + (d.id === state.selected ? ' selected' : '');
          item.addEventListener('click', () => { state.selected = d.id; render(); });
          item.innerHTML = `
            <div class="item-top">
              <div class="item-name"><span class="swatch" style="background:${colors[index % colors.length]}"></span>${labelFor(d)} · ${d.orientation === 'H' ? `横向 · Y${posIndex}` : `纵向 · X${posIndex}`}</div>
              <button class="delete-btn" type="button" aria-label="删除 ${labelFor(d)}">×</button>
            </div>
            <div class="item-result"><span class="slot-result">${slots} 槽</span><span class="mm-result">${lengthForSlots(slots)} mm</span></div>`;
          item.querySelector('.delete-btn').addEventListener('click', evt => { evt.stopPropagation(); deleteDivider(d.id); });
          list.append(item);
        });
      }

      function renderMetrics() {
        el('outerSize').textContent = `${outerForCells(state.xCells).toFixed(1)} × ${outerForCells(state.yCells).toFixed(1)} mm`;
        el('slotSize').textContent = `X ${maxX()} 槽 · Y ${maxY()} 槽`;
      }

      function render() {
        renderMetrics();
        renderList();
        draw();
      }

      let toastTimer;
      function showToast(message) {
        const toast = el('toast'); toast.textContent = message; toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
      }

      async function copyList() {
        if (!state.dividers.length) return showToast('还没有分隔板可以复制');
        const rows = [
          `Gridfinity 盒体：${state.xCells} × ${state.yCells} 格`,
          `盒体外形：${outerForCells(state.xCells).toFixed(1)} × ${outerForCells(state.yCells).toFixed(1)} mm`,
          `槽位范围：X ${maxX()}槽 / Y ${maxY()}槽`, '',
          ...state.dividers.map(d => {
            const ax = d.orientation === 'H' ? axX() : axY();
            const a = d.orientation === 'H' ? d.x1 : d.y1;
            const b = d.orientation === 'H' ? d.x2 : d.y2;
            const i0 = supportIndex(ax, Math.min(a, b));
            const i1 = supportIndex(ax, Math.max(a, b));
            const n = slotsOf(d);
            return `${labelFor(d)} ${d.orientation === 'H' ? '横向' : '纵向'}：${i0} → ${i1}｜${n}槽｜${lengthForSlots(n)} mm`;
          })
        ];
        try { await navigator.clipboard.writeText(rows.join('\n')); showToast('定制清单已复制'); }
        catch { showToast('浏览器未允许复制，请手动记录清单'); }
      }

      el('xCells').addEventListener('change', updateDimensions);
      el('yCells').addEventListener('change', updateDimensions);
      el('clearAll').addEventListener('click', () => { state.dividers = []; state.selected = null; render(); });
      el('copyList').addEventListener('click', copyList);
      window.addEventListener('resize', () => draw());
      window.addEventListener('keydown', evt => {
        if ((evt.key === 'Delete' || evt.key === 'Backspace') && state.selected && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) deleteDivider(state.selected);
      });

      render();
    })();
  </script>
  <script data-goatcounter="https://nexaio94.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
